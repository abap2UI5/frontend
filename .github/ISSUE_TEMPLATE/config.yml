# Issues for the frontend are tracked in abap2UI5/abap2UI5, together with the
# framework they belong to - the frontend artefacts published here are built
# from that repository, so a report filed here would have to be moved before it
# could be fixed. Same principle as the pull request lock in guard.yaml.
blank_issues_enabled: false
contact_links:
  - name: Bug report or feature request
    url: https://github.com/abap2UI5/abap2UI5/issues/new/choose
    about: The frontend is developed in abap2UI5/abap2UI5 and published here. Please report it there, where it can be fixed.
  - name: Installation help
    url: https://abap2ui5.github.io/docs/configuration/installation.html
    about: Which branch to pull for your system - cloud, cloud_v2, standard or standard_v2.
  - name: How this repository works
    url: https://github.com/abap2UI5/frontend/blob/main/CONTRIBUTING.md
    about: Why this repository is generated, what is owned here, and how maintenance changes are made.
