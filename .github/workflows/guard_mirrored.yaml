name: guard_mirrored

# The convention gate of this repository.
#
# abap2UI5/frontend is a DELIVERY repository: everything it ships is produced
# somewhere else and written here by a machine.
#
#   cloud, cloud_v2, built in abap2UI5/abap2UI5 from app/webapp + frontend/ and
#   standard,        pushed here by its frontend_deploy workflow, a freshly
#   standard_v2,     built tree straight onto the branch.
#   standard_<name>
#
# None of that arrives through a pull request. A pull request here is by
# definition a hand-written change, and a hand-written change to generated
# content is an invisible failure: it survives review, it survives merge, and
# it disappears without a trace on the next automated run.
#
# So the default answer to a pull request in this repository is NO. The gate
# below states that default out loud instead of letting people discover it
# weeks later.
#
# The one exception is the repository's own docs - README, CONTRIBUTING,
# AGENTS.md, the issue templates, this workflow. Nothing generates those, so
# they have to be maintainable here, and since the frontend build moved into
# abap2UI5/abap2UI5 they are all that main carries. (The ABAP handlers, the
# build tooling and the mirrored app/webapp copy used to live here too; all
# three are in abap2UI5/abap2UI5 now - the ABAP artefacts under frontend/, the
# tooling under tools/, the webapp under app/webapp.) Such a pull request opts
# out of the lock by carrying the label:
#
#     maintenance
#
# A label is used rather than a checkbox in the description on purpose: only
# accounts with triage or write permission can set one, so a contributor
# cannot unlock their own pull request. Applying the label re-runs this gate
# (see the "labeled" trigger below). The label does not exist in the repository
# yet - the first maintenance pull request creates it from the label picker,
# or an admin creates it once under Issues > Labels.
#
# Consequence worth knowing: this gate has no bot exemption. If dependency
# automation is ever enabled here, its pull requests need the label too. That
# is deliberate - an unattended bot merging into a delivery repository is
# exactly the thing this gate exists to make visible.
#
# Enforcement note for repository admins: make the "guard" job a required
# status check on main so the lock cannot be merged around.

on:
  pull_request:
    # labeled/unlabeled are needed on top of the defaults so that adding or
    # removing the maintenance label re-evaluates the lock.
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only main accepts pull requests
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" != "main" ]; then
            echo "::error::'$BASE' is a generated branch - abap2UI5/abap2UI5 rebuilds it from app/webapp + frontend/ and pushes the result directly, so a commit made here is discarded on the next build. Change it there instead."
            exit 1
          fi

      # main carries this repository's own docs and nothing else. Anything a
      # pull request adds outside them is either a file that belongs in
      # abap2UI5/abap2UI5, or a second copy of one that is already there - and
      # a second copy is what let the webapp and the build drift apart before.
      - name: main carries docs only
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASE"
          stray=$(git diff --name-only --diff-filter=d "origin/$BASE...HEAD" \
            | grep -Ev '^(\.github/|[A-Z_]+\.md$|LICENSE$|\.gitattributes$|\.nojekyll$)' || true)
          if [ -n "$stray" ]; then
            echo "::error::main is documentation only. The frontend source, the ABAP artefacts and the build all live in abap2UI5/abap2UI5 - the webapp in app/webapp/, the ABAP artefacts in frontend/, the tooling in tools/. A file added here would be a second copy that nothing builds from and nothing keeps in sync."
            echo ""
            echo "Files that do not belong in this repository:"
            echo "$stray" | sed 's/^/  /'
            echo ""
            echo "The maintenance label does not lift this."
            exit 1
          fi
          echo "docs only"

      - name: Pull requests are locked by default
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'maintenance') }}
        run: |
          echo "::error::This repository does not take manual pull requests. Its content is written by automation: every branch except main is built in abap2UI5/abap2UI5 and pushed here. Frontend changes belong there."
          echo ""
          echo "  Where a change belongs"
          echo "  ----------------------"
          echo "  the UI5 webapp, i.e. app/webapp/**"
          echo "      -> abap2UI5/abap2UI5, in app/webapp/"
          echo "         run 'npm run app2abap' there to regenerate src/01/03,"
          echo "         and the frontend_deploy workflow delivers it here."
          echo "  the ABAP handlers, the packaging, the build"
          echo "      -> abap2UI5/abap2UI5, in frontend/ and tools/."
          echo "  a bug report or a feature request"
          echo "      -> https://github.com/abap2UI5/abap2UI5/issues"
          echo "  this repository's own docs"
          echo "      -> here, as a maintenance pull request (see below)."
          echo ""
          echo "  Maintenance pull requests"
          echo "  -------------------------"
          echo "  Maintaining the docs is the one thing that legitimately"
          echo "  happens in this repository, because nothing generates them."
          echo "  Such a pull request is unlocked by a maintainer adding the"
          echo "  label"
          echo ""
          echo "      maintenance"
          echo ""
          echo "  which re-runs this check. If you believe your change qualifies,"
          echo "  say so in the description and ask for the label - do not work"
          echo "  around this gate."
          echo ""
          echo "  Full rationale: CONTRIBUTING.md and the README."
          exit 1

      - name: Maintenance change acknowledged
        if: ${{ contains(github.event.pull_request.labels.*.name, 'maintenance') }}
        run: |
          echo "maintenance label set - treated as a change to this repository's"
          echo "own docs. Generated content stays blocked by the checks above."
