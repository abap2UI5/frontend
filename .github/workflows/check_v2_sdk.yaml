name: check_v2_sdk

# The v2 branches bootstrap UI5 from a public CDN at the version hard-coded
# in .github/app2app_v2/patch-v2.mjs — the one manually bumped external pin
# in this repo. This monthly check fails (and files an issue) when that
# version is no longer served or a newer legacy-free version exists.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 2 * *'   # monthly, day after the build safety net

permissions:
  contents: read
  issues: write  # to report failed scheduled runs

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'
    - run: node .github/scripts/check-v2-sdk.mjs

    - name: Report scheduled failure as issue
      if: failure() && github.event_name == 'schedule'
      uses: abap2UI5/abap2UI5/.github/actions/report-scheduled-failure@6fb08d08c422c7c38eb320e42d010fbd5cdb1279 # main 2026-07-13
